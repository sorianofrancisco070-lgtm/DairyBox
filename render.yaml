# =========================================================
# DairyBox – Render Blueprint
# =========================================================
services:
  - type: web
    name: dairybox-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /index.php

    dockerBuildArgs:
      - name: CACHEBUST
        generateValue: true   # Render generates a new value every deploy

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: dairybox-mysql
          property: host

      - key: DB_PORT
        fromDatabase:
          name: dairybox-mysql
          property: port

      - key: DB_NAME
        fromDatabase:
          name: dairybox-mysql
          property: database

      - key: DB_USER
        fromDatabase:
          name: dairybox-mysql
          property: user

      - key: DB_PASS
        fromDatabase:
          name: dairybox-mysql
          property: password

databases:
  - name: dairybox-mysql
    databaseName: dairybox_db
    plan: free
